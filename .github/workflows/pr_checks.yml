name: PR checks (smoke daily & FX)
on:
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install "pytest>=8,<9"
      - name: Configure CI offline network audit (after dependency installation)
        run: |
          echo "KLD_PR_OFFLINE=1" >> "$GITHUB_ENV"
          echo "KLD_PR_OFFLINE_AUDIT=$RUNNER_TEMP/kld-pr-network-attempts.log" >> "$GITHUB_ENV"
      - name: Verify explicit offline runner blocks DNS and direct socket calls
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py - <<'PYGUARD'
          import socket, subprocess
          for label, fn in (
              ("DNS", lambda: socket.getaddrinfo("example.invalid", 443)),
              ("socket", lambda: socket.socket().connect(("192.0.2.1", 443))),
          ):
              try:
                  fn()
              except RuntimeError as exc:
                  assert "external network access prohibited" in str(exc)
              else:
                  raise AssertionError(label + " not blocked")
          try:
              subprocess.run(["curl", "https://example.invalid"], check=True)
          except RuntimeError as exc:
              assert "external network access prohibited" in str(exc)
          else:
              raise AssertionError("subprocess escape not blocked")
          print("PASS blocked attempts recorded")
          PYGUARD
          test -s "$KLD_PR_OFFLINE_AUDIT"
          rm -f "$KLD_PR_OFFLINE_AUDIT"
      - name: Gemini migration regressions (offline)
        env:
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          TELEGRAM_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_TOKEN_KLG: ""
          POLLINATIONS_TOKEN: ""
          POLLINATIONS_API_KEY: ""
          VAYBOMETER_CACHE_DIR: ${{ runner.temp }}/vaybometer-cache
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1
        run: |
          python tools/ci_offline_guard/runner.py - <<'PY'
          import runpy

          suite = runpy.run_path("tools/test_groq_model_migration.py", run_name="gemini_migration_offline")
          for check in (
              "test_no_deprecated_model_ids_in_runtime_files",
              "test_default_groq_model_config",
              "test_default_gemini_model_config",
              "test_gemini_37_falls_back_without_legacy_sampling_controls",
              "test_removed_gemini_preview_ids_are_not_runtime_candidates",
              "test_primary_failure_attempts_fallback_model",
              "test_total_groq_failure_uses_local_blurb_fallback",
          ):
              suite[check]()
          print("OK: Gemini migration offline checks passed")
          PY
      - name: KLD FORMAT_V2 text regressions (offline)
        env:
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          TELEGRAM_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_TOKEN_KLG: "test-token"
          POLLINATIONS_TOKEN: ""
          POLLINATIONS_API_KEY: ""
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py tools/test_format_v2_evening_kld.py
          python tools/ci_offline_guard/runner.py tools/test_format_v2_morning_kld.py
      - name: KLD weekly forecast regressions (offline)
        env:
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          TELEGRAM_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_TOKEN_KLG: ""
          POLLINATIONS_TOKEN: ""
          POLLINATIONS_API_KEY: ""
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py tools/test_weekly_forecast.py
          python tools/ci_offline_guard/runner.py tools/test_weekly_photo_cover.py
      - name: Fixture-based daily and FX CLI smoke (offline)
        env:
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          TELEGRAM_TOKEN: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_TOKEN_KLG: "test"
          CHANNEL_ID_KLG: "-1001234567890"
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py tools/test_pr_ci_offline_smoke_kld.py
          python tools/ci_offline_guard/runner.py tools/test_fx_market_pulse_kld.py
      - name: KLD A1 geomagnetic history regressions (offline)
        # Skip only on the CI-safety prerequisite PR; mandatory once A1 file exists.
        if: ${{ hashFiles('tools/test_geomagnetic_history.py') != '' }}
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_geomagnetic_history.py
      - name: KLD H1 NOAA observed-3h transport regressions (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_geomagnetic_noaa_transport.py
      - name: KLD R3/R4 NOAA immutable evidence regressions (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_geomagnetic_noaa_evidence.py
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_verify_kld_noaa_artifact.py
      - name: KLD H2-A incident reconciliation regressions (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_geomagnetic_reconciliation.py
      - name: KLD H2-B1 canonical state codec regressions (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_geomagnetic_state_codec.py
      - name: KLD H2-B1 GitRef CAS adapter regressions (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_geomagnetic_gitref_store.py
      - name: KLD H2-B2-A isolated GitHub REST transport regressions (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_geomagnetic_github_transport.py
      - name: KLD H2-B2-B1 bootstrap/recovery Golden Set (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_kld_geomagnetic_bootstrap_recovery.py
      - name: KLD H2-B2-C1 end-to-end geomagnetic integration (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_kld_geomagnetic_e2e.py
      - name: KLD H2-B2-D1 TEST-only bootstrap regressions (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_kld_geomagnetic_test_bootstrap.py
      - name: KLD D4-S3 TEST-only geomagnetic runtime regressions (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m pytest -q tools/test_geomagnetic_test_runtime.py
      - name: KLD visual regressions (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py -m compileall -q \
            image_prompt_kld.py \
            image_prompt_kld_morning.py \
            kld_visual_policy.py \
            kld_image_content_guard.py \
            kld_visual_dedup.py \
            kld_image_first.py \
            tools/kld_visual_fixture_image.py \
            tools/test_kld_morning_prompt_contract.py \
            tools/test_kld_evening_controlled_variety.py
          python tools/ci_offline_guard/runner.py - <<'PY'
          import runpy

          suite = runpy.run_path("tools/test_visual_kld.py", run_name="kld_visual_legacy")
          for case in suite["CASES"]:
              suite["run_case"](case)
          for check in (
              "run_image_prompt_bridge_case",
              "run_first_quarter_moon_guard_case",
              "run_last_quarter_59_moon_guard_case",
              "run_not_quite_full_moon_guard_case",
              "run_full_moon_evening_moonlit_guard_case",
              "run_waning_gibbous_moon_guard_case",
              "run_storm_waning_92_visual_guard_case",
              "run_new_moon_storm_finalizer_case",
              "run_new_moon_nonstorm_and_cloud_cases",
              "run_unknown_moon_does_not_force_visible_cue_case",
              "run_storm_full_moon_single_cue_case",
              "run_nonstorm_warning_does_not_get_storm_visual_case",
              "run_gust19_without_storm_word_gets_storm_visual_case",
              "run_storm_overlay_warning_priority_cases",
              "run_scene_family_rotation_cases",
              "run_scene_retry_and_cache_key_cases",
          ):
              suite[check]()
          print("OK: current legacy KLD synthetic checks passed (superseded morning/mixed-variety blocks excluded)")
          PY
          python tools/ci_offline_guard/runner.py tools/test_kld_morning_prompt_contract.py
          python tools/ci_offline_guard/runner.py tools/test_kld_evening_controlled_variety.py
          python tools/ci_offline_guard/runner.py tools/test_kld_lunar_phase_boundary.py
          python tools/ci_offline_guard/runner.py tools/test_lunar_long_desc.py
          python tools/ci_offline_guard/runner.py tools/test_kld_visual_policy.py
          python tools/ci_offline_guard/runner.py tools/test_kld_image_content_guard.py
          python tools/ci_offline_guard/runner.py tools/test_kld_summer_vegetation_prompt.py
          python tools/ci_offline_guard/runner.py tools/test_kld_visual_dedup.py
          python tools/ci_offline_guard/runner.py tools/test_kld_evening_allocator_policy.py
          python tools/ci_offline_guard/runner.py tools/test_kld_visual_season_boundary.py
          python tools/ci_offline_guard/runner.py tools/test_kld_visual_decision_policy.py
          python tools/ci_offline_guard/runner.py tools/test_kld_august_2026_visual_regression.py
          python tools/ci_offline_guard/runner.py tools/test_kld_image_first.py
          python tools/ci_offline_guard/runner.py tools/test_kld_semantic_qa_seam.py
          python tools/ci_offline_guard/runner.py tools/test_kld_visual_workflow.py
      - name: KLD semantic QA R4 regressions (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py tools/test_kld_semantic_qa_r4_offline.py
          python tools/ci_offline_guard/runner.py tools/test_kld_semantic_qa_r4_wiring.py
          python tools/ci_offline_guard/runner.py tools/test_kld_semantic_qa_r4_e2e.py
      - name: KLD semantic QA R5 source and visibility regressions (offline)
        run: |
          set -euo pipefail
          python tools/ci_offline_guard/runner.py tools/test_kld_semantic_qa_r5_source.py
          python tools/ci_offline_guard/runner.py tools/test_visibility_kld.py
      - name: Verify zero attempted network connections in PR regressions
        if: always()
        run: |
          set -euo pipefail
          if test -s "$KLD_PR_OFFLINE_AUDIT"; then
            echo "::error::PR regression process attempted external network access"
            cat "$KLD_PR_OFFLINE_AUDIT"
            exit 1
          fi
          echo "PASS: no external network attempts during PR regressions"
