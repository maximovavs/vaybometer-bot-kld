name: Weekly VayboMeter Forecast

on:
  schedule:
    # 22:00 Europe/Kaliningrad.
    - cron: "0 20 * * 6"
  workflow_dispatch:
    inputs:
      date:
        description: "Week start date YYYY-MM-DD, empty = today"
        required: false
        default: ""
      send_to_test:
        description: "Publish weekly forecast to test channel?"
        type: boolean
        required: true
        default: true
      publish_to_prod:
        description: "Publish weekly forecast to production channel?"
        type: boolean
        required: true
        default: false
      channel_override:
        description: "Optional Telegram chat/channel override. If set, send only there."
        required: false
        default: ""
      dry_run:
        description: "Preview only, do not send to Telegram"
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-vaybometer-forecast-kld
  cancel-in-progress: false

env:
  TELEGRAM_TOKEN_KLG: ${{ secrets.TELEGRAM_TOKEN_KLG }}
  CHANNEL_ID_KLG: ${{ secrets.CHANNEL_ID_KLG }}
  CHANNEL_ID_TEST: ${{ secrets.CHANNEL_ID_TEST }}
  CHANNEL_ID_OVERRIDE: ${{ github.event.inputs.channel_override }}
  WEEK_START_DATE: ${{ github.event.inputs.date }}
  SEND_TO_TEST: ${{ github.event.inputs.send_to_test }}
  PUBLISH_TO_PROD: ${{ github.event.inputs.publish_to_prod }}
  DRY_RUN: ${{ github.event.inputs.dry_run }}
  AIRVISUAL_KEY: ${{ secrets.AIRVISUAL_KEY }}
  OWM_KEY: ${{ secrets.OWM_KEY }}
  TZ: Europe/Kaliningrad
  VAYBOMETER_CACHE_DIR: ".cache"

jobs:
  weekly_forecast:
    name: Build / optionally publish weekly forecast
    runs-on: ubuntu-latest
    steps:
      - name: Schedule guard
        id: schedule_guard
        shell: bash
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${SCHEDULE_EXPR:-}" != "0 20 * * 6" ]; then
            echo "Skipping unknown weekly schedule: ${SCHEDULE_EXPR:-∅}"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          week_start="$(python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import os

          today = datetime.now(ZoneInfo(os.environ.get("TZ", "Europe/Kaliningrad"))).date()
          days_since_saturday = (today.weekday() - 5) % 7
          scheduled_saturday = today - timedelta(days=days_since_saturday)
          week_start = scheduled_saturday + timedelta(days=2)
          print(week_start.isoformat())
          PY
          )"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "week_start=$week_start" >> "$GITHUB_OUTPUT"
          echo "Accepted KLD weekly scheduled event: ${SCHEDULE_EXPR}"
          echo "Scheduled weekly range starts Monday: $week_start"

      - name: Resolve weekly date
        id: weekly_date
        if: steps.schedule_guard.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "week_start=${{ steps.schedule_guard.outputs.week_start }}" >> "$GITHUB_OUTPUT"
          else
            echo "week_start=${WEEK_START_DATE:-}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.schedule_guard.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.schedule_guard.outputs.should_run == 'true'
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore previous canonical weekly snapshot
        if: steps.schedule_guard.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          week_start="${{ steps.weekly_date.outputs.week_start }}"
          rm -f weekly_snapshot_state/previous.json
          if [ -z "$week_start" ]; then
            echo "WeeklySnapshot restore skipped: no explicit week_start."
            exit 0
          fi
          python weekly_snapshot.py restore \
            --region kld \
            --current-week-start "$week_start" \
            --artifact-prefix weekly-snapshot-kld \
            --output weekly_snapshot_state/previous.json
      - name: Install dependencies
        if: steps.schedule_guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build preview / optionally send weekly forecast
        if: steps.schedule_guard.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            CHANNEL_ID_OVERRIDE=""
            WEEK_START_DATE="${{ steps.weekly_date.outputs.week_start }}"
            SEND_TO_TEST="false"
            PUBLISH_TO_PROD="true"
            DRY_RUN="false"
            echo "Weekly forecast target: scheduled production"
            echo "Scheduled weekly range starts Monday: $WEEK_START_DATE"
          fi

          args=("send_weekly_forecast.py")
          if [ -n "${WEEK_START_DATE:-}" ]; then
            args+=("--date" "$WEEK_START_DATE")
          fi

          echo "Weekly forecast preview:"
          python "${args[@]}" | tee weekly_forecast_preview.log

          intended=()
          if [ -n "${CHANNEL_ID_OVERRIDE:-}" ]; then
            intended+=("override $CHANNEL_ID_OVERRIDE")
          else
            if [ "${SEND_TO_TEST:-}" = "true" ]; then
              intended+=("test")
            fi
            if [ "${PUBLISH_TO_PROD:-}" = "true" ]; then
              intended+=("production")
            fi
          fi

          if [ "${DRY_RUN:-}" = "true" ]; then
            echo "Weekly forecast target: dry-run"
            if [ "${#intended[@]}" -gt 0 ]; then
              printf 'Dry-run intended target: %s\n' "${intended[@]}"
            else
              echo "Dry-run intended target: none"
            fi
            exit 0
          fi

          targets=()
          labels=()

          add_target() {
            local label="$1"
            local chat_id="$2"
            if [ -z "$chat_id" ]; then
              echo "Telegram destination for $label is empty"
              exit 1
            fi
            for existing in "${targets[@]}"; do
              if [ "$existing" = "$chat_id" ]; then
                echo "Weekly forecast target: $label (same chat as earlier destination; skipping duplicate send)"
                return
              fi
            done
            targets+=("$chat_id")
            labels+=("$label")
          }

          if [ -n "${CHANNEL_ID_OVERRIDE:-}" ]; then
            add_target "override $CHANNEL_ID_OVERRIDE" "$CHANNEL_ID_OVERRIDE"
          else
            if [ "${SEND_TO_TEST:-}" = "true" ]; then
              add_target "test" "$CHANNEL_ID_TEST"
            fi
            if [ "${PUBLISH_TO_PROD:-}" = "true" ]; then
              add_target "production" "$CHANNEL_ID_KLG"
            fi
          fi

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No Telegram destination selected. Choose test, prod, or channel_override."
            exit 1
          fi

          for i in "${!targets[@]}"; do
            echo "Weekly forecast target: ${labels[$i]}"
            send_args=("${args[@]}" "--send" "--chat-id" "${targets[$i]}")
            if [ "${labels[$i]}" = "production" ] && [ -n "${WEEK_START_DATE:-}" ]; then
              send_args+=("--production-snapshot-out" "weekly_snapshot_state/current.json")
            fi
            python "${send_args[@]}"
          done

      - name: Check existing canonical weekly snapshot
        id: weekly_snapshot_gate
        if: steps.schedule_guard.outputs.should_run == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s weekly_snapshot_state/current.json ]; then
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            echo "No authoritative current WeeklySnapshot produced."
            exit 0
          fi
          week_start="$(python -c 'import json; print(json.load(open("weekly_snapshot_state/current.json", encoding="utf-8"))["week_start"])')"
          if python weekly_snapshot.py canonical-exists --region kld --week-start "$week_start" --artifact-prefix weekly-snapshot-kld; then
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            echo "Canonical WeeklySnapshot already exists; late/duplicate run will not overwrite it."
          else
            echo "should_upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload canonical weekly snapshot
        if: steps.weekly_snapshot_gate.outputs.should_upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-snapshot-kld-${{ steps.weekly_date.outputs.week_start }}
          path: weekly_snapshot_state/current.json
          if-no-files-found: error
          retention-days: 30
